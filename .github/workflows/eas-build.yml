name: Build iOS IPA

on:
  push:
    branches:
      - build
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: npm ci

      - name: Install Expo CLI
        run: npm install -g expo-cli @expo/cli

      - name: Fix PNG assets (re-encode to fix CRC errors)
        run: |
          for f in assets/*.png; do
            sips -s format png "$f" --out "$f"
          done

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --clean

      - name: Build IPA (unsigned)
        run: |
          xcodebuild archive \
            -workspace ios/UniVersal.xcworkspace \
            -scheme UniVersal \
            -configuration Release \
            -archivePath $RUNNER_TEMP/UniVersal.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty || true

          mkdir -p $RUNNER_TEMP/ipa/Payload
          cp -r "$RUNNER_TEMP/UniVersal.xcarchive/Products/Applications/UniVersal.app" \
            "$RUNNER_TEMP/ipa/Payload/UniVersal.app"
          cd $RUNNER_TEMP/ipa && zip -r ../UniVersal.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniVersal-ios
          path: ${{ runner.temp }}/UniVersal.ipa
          retention-days: 7
