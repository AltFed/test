name: Build iOS IPA

on:
  push:
    branches:
      - build
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: npm ci

      - name: Install Expo CLI
        run: npm install -g expo-cli @expo/cli

      - name: Generate placeholder PNG assets (source files are invalid)
        run: |
          pip3 install Pillow --quiet --break-system-packages
          python3 - << 'PYEOF'
          from PIL import Image, ImageDraw
          import os

          def make_icon(path, size, bg=(17, 17, 17, 255), fg=(255, 230, 0, 255)):
              img = Image.new('RGBA', (size, size), bg)
              d = ImageDraw.Draw(img)
              m = size // 8
              d.ellipse([m, m, size - m, size - m], fill=fg)
              os.makedirs(os.path.dirname(path) or '.', exist_ok=True)
              img.save(path, 'PNG')
              print(f'Generated: {path} ({size}x{size})')

          make_icon('assets/icon.png', 1024)
          make_icon('assets/adaptive-icon.png', 1024)
          make_icon('assets/splash-icon.png', 200)
          make_icon('assets/favicon.png', 48)
          PYEOF

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --clean

      - name: Build IPA (unsigned)
        run: |
          xcodebuild archive \
            -workspace ios/UniVersal.xcworkspace \
            -scheme UniVersal \
            -configuration Release \
            -archivePath $RUNNER_TEMP/UniVersal.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty || true

          mkdir -p $RUNNER_TEMP/ipa/Payload
          cp -r "$RUNNER_TEMP/UniVersal.xcarchive/Products/Applications/UniVersal.app" \
            "$RUNNER_TEMP/ipa/Payload/UniVersal.app"
          cd $RUNNER_TEMP/ipa && zip -r ../UniVersal.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniVersal-ios
          path: ${{ runner.temp }}/UniVersal.ipa
          retention-days: 7
